name: Mirror daily price history

# Publishes the daily bars the app's charts read, into
# app/public/data/series/<TICKER>.json.
#
# Same reasoning as mirror-screener.yml: the upstream data changes once a day,
# the API key must stay server-side, and the free key's daily allowance is far
# too small to let the browser spend it. So it is fetched once here and served
# to every visitor as a static file from Vercel's edge.
#
# All of the logic lives in scripts/mirror-prices.mjs — see the contract at the
# top of that file — because mapping a nested payload into a sorted series is
# program logic, and it is covered by tests that run in CI.

on:
  schedule:
    # US sessions close at 20:00/21:00 UTC depending on daylight saving, and
    # the provider needs a while after that to settle the day's bar. 23:30 UTC
    # is comfortably past both without slipping into the next UTC day, which
    # would make `as_of` read a day stale to the freshness gate.
    - cron: '30 23 * * 1-5'
  # Manual runs for the first publish, and for backfilling after an outage.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-prices
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and publish the day's bars
        # The script exits non-zero if it published nothing at all, which fails
        # the job here. A partial run — some tickers refreshed, one skipped
        # because the provider does not cover it — is a success, and the
        # skipped names are listed in the log.
        env:
          # May be the same key as the one /api/earnings uses, or a separate
          # one. If it is shared, note that this job spends one call per
          # covered ticker per day out of that key's daily allowance, and the
          # earnings route has to live on the rest.
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: node scripts/mirror-prices.mjs

      - name: Commit if the data changed
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # `git add` first, then diff the INDEX: plain `git diff` reports no
          # change for an untracked file, so the very first publish of a new
          # ticker would look like "nothing to commit" and never land.
          git add app/public/data/series

          if git diff --cached --quiet -- app/public/data/series; then
            echo "No change in price history — nothing to commit."
            exit 0
          fi

          git commit -m "Mirror daily price history"

          # Minutes pass while the script paces its requests, so the branch may
          # have moved. This commit only touches the series directory, so it
          # replays cleanly; a genuine conflict still fails the job loudly.
          if ! git push; then
            echo "Push rejected — branch moved. Rebasing onto it and retrying once."
            git pull --rebase --autostash
            git push
          fi
