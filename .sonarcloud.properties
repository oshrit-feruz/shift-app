# SonarCloud automatic-analysis settings.
#
# Duplication detection is turned off for the bilingual string table, and for
# nothing else.
#
# Every line in app/src/i18n/strings.ts has the same shape by design —
#   'some.key': p('English text', 'טקסט בעברית'),
# — and Sonar normalises string literals before comparing blocks, so any ten
# consecutive lines of that table look identical to any other ten. The result
# is that adding UI copy raises "Duplication on New Code" no matter what the
# copy says, and the only way to lower the number would be to make the
# translation table harder to read. That is a measurement artifact of a data
# table, not duplicated logic.
#
# This exclusion covers duplication only. Every quality, security and
# reliability rule still applies to this file and to every other one.
sonar.cpd.exclusions=**/i18n/strings.ts
