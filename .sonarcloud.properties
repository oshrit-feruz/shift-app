# SonarCloud automatic-analysis settings.
#
# Duplication detection is turned off for the bilingual string table, and for
# nothing else.
#
# Every line in app/src/i18n/strings.ts has the same shape by design —
#   'some.key': p('English text', 'טקסט בעברית'),
# — and Sonar normalises string literals before comparing blocks, so any ten
# consecutive lines of that table look identical to any other ten. The result
# is that adding UI copy raises "Duplication on New Code" no matter what the
# copy says, and the only way to lower the number would be to make the
# translation table harder to read. That is a measurement artifact of a data
# table, not duplicated logic.
#
# This exclusion covers duplication only. Every quality, security and
# reliability rule still applies to this file and to every other one.
sonar.cpd.exclusions=**/i18n/strings.ts

# ── plsql:S1192 on the migrations ──────────────────────────────────────
#
# "Define a constant instead of duplicating this literal 3 times", raised on
# supabase/migrations/0011_funnel_events.sql for 'broker_action_clicked'.
#
# The three occurrences are a CHECK constraint listing the legal stage names,
# an index predicate excluding that one stage from the once-per-session rule,
# and a CASE in the reporting view that orders the funnel. Each is
# load-bearing, each is a different construct, and none is a copy of another —
# what they share is the name of a thing, which is what a name is for.
#
# The remedy the rule asks for does not exist here. Plain DDL has no constant
# to extract a literal into; the nearest equivalents (a DO block, or psql's
# \set) would stop the file being pasteable into the Supabase SQL editor,
# which is exactly how this repo runs migrations — see supabase/README.md.
# So satisfying the rule would cost the property that makes these files
# usable, to remove a repetition that is not a defect. The rule is also
# Sonar's PL/SQL analyzer applied to Postgres DDL, where its assumptions
# about constants do not hold.
#
# Same reasoning as the duplication exclusion above: a measurement artifact
# of the file's shape, not a finding about its logic. Scoped to this rule and
# to the migrations directory alone — every other rule still applies to these
# files, and S1192 still applies everywhere else.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.e1.resourcePath=supabase/migrations/**/*.sql
