# SonarCloud automatic-analysis settings.
#
# Duplication detection is turned off for the bilingual string table, and for
# nothing else.
#
# Every line in app/src/i18n/strings.ts has the same shape by design —
#   'some.key': p('English text', 'טקסט בעברית'),
# — and Sonar normalises string literals before comparing blocks, so any ten
# consecutive lines of that table look identical to any other ten. The result
# is that adding UI copy raises "Duplication on New Code" no matter what the
# copy says, and the only way to lower the number would be to make the
# translation table harder to read. That is a measurement artifact of a data
# table, not duplicated logic.
#
# This exclusion covers duplication only. Every quality, security and
# reliability rule still applies to this file and to every other one.
sonar.cpd.exclusions=**/i18n/strings.ts

# Analysis scope.
#
# design-reference/ is the shipping design handed over as static artefacts:
# six .dc.html mockups, a few .jsx/.js sketches, and the images they use. It is
# reference material, not source. Nothing imports it — app/src/styles/tokens.css
# names one file in a comment, as provenance, and that is the only mention in
# the repository. It is absent from vite.config.ts, tsconfig.json, package.json
# and vercel.json, so it is neither built nor shipped.
#
# WHY THIS IS NOT COSMETIC. SonarCloud bills lines of code per organisation and
# rejects an analysis that would exceed the plan. Every `main` analysis since
# 2026-08-29 has been refused:
#
#   "This analysis will make your organization 'oshrit-feruz' reach the maximum
#    allowed lines limit of 50000. Current LOC usage is: 14021.
#    LOC count in this analysis: 51679."
#
# Pull-request scans kept succeeding, so nothing went red — every PR in the past
# week carried a "Quality Gate passed" comment graded against a baseline from
# 29 August. See issue #58.
#
# design-reference is 13,569 of those lines, essentially the whole of Sonar's
# `js` (6,708) and `web` (6,861) totals: measured on this tree, it holds 7,205
# non-blank js/jsx lines and 6,824 html against 157 outside it. Excluding it
# takes the count from 51,679 to roughly 38,100 — under the cap with room, and
# without excluding one line of code anyone runs.
#
# This exclusion covers ANALYSIS SCOPE, not a rule. Nothing that ships loses
# coverage by it.
sonar.exclusions=design-reference/**
