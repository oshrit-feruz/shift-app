# SonarCloud automatic-analysis settings.
#
# Duplication detection is turned off for the bilingual string table, and for
# nothing else.
#
# Every line in app/src/i18n/strings.ts has the same shape by design —
#   'some.key': p('English text', 'טקסט בעברית'),
# — and Sonar normalises string literals before comparing blocks, so any ten
# consecutive lines of that table look identical to any other ten. The result
# is that adding UI copy raises "Duplication on New Code" no matter what the
# copy says, and the only way to lower the number would be to make the
# translation table harder to read. That is a measurement artifact of a data
# table, not duplicated logic.
#
# This exclusion covers duplication only. Every quality, security and
# reliability rule still applies to this file and to every other one.
sonar.cpd.exclusions=**/i18n/strings.ts

# ── plsql:S1192 on the migrations ──────────────────────────────────────
#
# "Define a constant instead of duplicating this literal 3 times", raised on
# supabase/migrations/0011_funnel_events.sql for 'broker_action_clicked'.
#
# NOT SUPPRESSED HERE, because it cannot be. This project uses SonarCloud
# automatic analysis, which reads only a fixed set of properties from this
# file — sonar.sources, sonar.exclusions, sonar.inclusions, sonar.tests,
# sonar.test.*, sonar.sourceEncoding, sonar.cpd.exclusions,
# sonar.python.version and sonar.cfamily.*. `sonar.issue.ignore.multicriteria`
# is not one of them, so a rule-scoped exclusion written here is inert: it
# looks like configuration and does nothing. (That is also why the duplication
# exclusion above works — sonar.cpd.exclusions IS on the supported list.)
#
# sonar.exclusions would work and is deliberately not used: it drops the
# migrations from analysis entirely, so every other rule — including the
# security ones that matter most on files that define RLS policies — would
# stop applying in order to silence one code smell.
#
# The reasoning, kept here because it is the part worth keeping:
#
#   The three occurrences are a CHECK constraint listing the legal stage
#   names, an index predicate excluding one stage from the once-per-session
#   rule, and a CASE in the reporting view that orders the funnel. Each is
#   load-bearing, each is a different construct, and none is a copy of
#   another — what they share is the name of a thing, which is what a name is
#   for. Plain DDL has no constant to extract them into, and the nearest
#   equivalents (a DO block, psql's \set) would stop the file being pasteable
#   into the Supabase SQL editor, which is how this repo runs migrations.
#   It is also Sonar's PL/SQL analyzer applied to Postgres DDL, where its
#   assumptions about constants do not hold.
#
# So the finding stands open in SonarCloud, where it can be declined per
# issue with this reasoning attached. The quality gate passes either way.
