# SonarCloud automatic-analysis settings.
#
# Duplication detection is turned off for the bilingual string table, and for
# nothing else.
#
# Every line in app/src/i18n/strings.ts has the same shape by design —
#   'some.key': p('English text', 'טקסט בעברית'),
# — and Sonar normalises string literals before comparing blocks, so any ten
# consecutive lines of that table look identical to any other ten. The result
# is that adding UI copy raises "Duplication on New Code" no matter what the
# copy says, and the only way to lower the number would be to make the
# translation table harder to read. That is a measurement artifact of a data
# table, not duplicated logic.
#
# This exclusion covers duplication only. Every quality, security and
# reliability rule still applies to this file and to every other one.
sonar.cpd.exclusions=**/i18n/strings.ts

# Analysis scope.
#
# design-reference/ is the shipping design handed over as static artefacts:
# six .dc.html mockups, a few .jsx/.js sketches, and the images they use. It is
# reference material, not source. Nothing imports it — app/src/styles/tokens.css
# names one file in a comment, as provenance, and that is the only mention in
# the repository. It is absent from vite.config.ts, tsconfig.json, package.json
# and vercel.json, so it is neither built nor shipped.
#
# WHY THIS IS NOT COSMETIC. SonarCloud bills lines of code per organisation and
# rejects an analysis that would exceed the plan. Every `main` analysis since
# 2026-08-29 has been refused:
#
#   "This analysis will make your organization 'oshrit-feruz' reach the maximum
#    allowed lines limit of 50000. Current LOC usage is: 14021.
#    LOC count in this analysis: 51679."
#
# Pull-request scans kept succeeding, so nothing went red — every PR in the past
# week carried a "Quality Gate passed" comment graded against a baseline from
# 29 August. See issue #58.
#
# design-reference is 13,569 of those lines, essentially the whole of Sonar's
# `js` (6,708) and `web` (6,861) totals: measured on this tree, it holds 7,205
# non-blank js/jsx lines and 6,824 html against 157 outside it. Excluding it
# takes the count from 51,679 to roughly 38,100 — under the cap with room, and
# without excluding one line of code anyone runs.
#
# This exclusion covers ANALYSIS SCOPE, not a rule. Nothing that ships loses
# coverage by it.
sonar.exclusions=design-reference/**

# ── plsql:S1192 on the migrations ──────────────────────────────────────
#
# "Define a constant instead of duplicating this literal 3 times", raised on
# supabase/migrations/0011_funnel_events.sql for 'broker_action_clicked'.
#
# NOT SUPPRESSED HERE, because it cannot be. This project uses SonarCloud
# automatic analysis, which reads only a fixed set of properties from this
# file — sonar.sources, sonar.exclusions, sonar.inclusions, sonar.tests,
# sonar.test.*, sonar.sourceEncoding, sonar.cpd.exclusions,
# sonar.python.version and sonar.cfamily.*. `sonar.issue.ignore.multicriteria`
# is not one of them, so a rule-scoped exclusion written here is inert: it
# looks like configuration and does nothing. (That is also why the duplication
# exclusion above works — sonar.cpd.exclusions IS on the supported list.)
#
# sonar.exclusions would work and is deliberately not used: it drops the
# migrations from analysis entirely, so every other rule — including the
# security ones that matter most on files that define RLS policies — would
# stop applying in order to silence one code smell.
#
# The reasoning, kept here because it is the part worth keeping:
#
#   The three occurrences are a CHECK constraint listing the legal stage
#   names, an index predicate excluding one stage from the once-per-session
#   rule, and a CASE in the reporting view that orders the funnel. Each is
#   load-bearing, each is a different construct, and none is a copy of
#   another — what they share is the name of a thing, which is what a name is
#   for. Plain DDL has no constant to extract them into, and the nearest
#   equivalents (a DO block, psql's \set) would stop the file being pasteable
#   into the Supabase SQL editor, which is how this repo runs migrations.
#   It is also Sonar's PL/SQL analyzer applied to Postgres DDL, where its
#   assumptions about constants do not hold.
#
# So the finding stands open in SonarCloud, where it can be declined per
# issue with this reasoning attached. The quality gate passes either way.

# ── Test sources, declared as tests ────────────────────────────────────
#
# The remaining half of #58. Excluding design-reference took the analysis from
# 51,679 lines to 38,225, and it is STILL refused, because the 50,000 is an
# ORGANISATION cap and the other private projects' lines are added to it:
#
#   Current LOC usage is: 14021.  LOC count in this analysis: 38225.
#   14,021 + 38,225 = 52,246
#
# That 14,021 is the sum of the other PRIVATE projects — public ones are not
# billed — which is why it does not match the sum of every project in the
# organisation. shift-app has to analyse under 50,000 − 14,021 = 35,979, and is
# 2,246 over.
#
# WHY THIS IS CLASSIFICATION AND NOT A DODGE. Sonar's own documentation:
# "Lines of test code do not count toward your License Usage." These 69 files
# ARE test code — they are the repo's vitest suite — and declaring them as such
# is describing the tree accurately. They keep being analysed; test files are
# held to test rules rather than dropped, which is the difference between this
# and sonar.exclusions above.
#
# Measured on this tree: 69 files, 11,907 non-blank lines, every one of them
# matching *.test.ts. The only other file under a test directory is
# app/api/_tests/README.md, which is not analysed as code either way.
#
# sonar.tests sets the initial test scope and sonar.test.inclusions filters
# within it. The scanner converts a test inclusion into a source exclusion so a
# file cannot be both — and if one ever ended up as both, the analysis FAILS
# rather than quietly picking one, which is the failure mode worth having.
#
# .tsx is listed though no test currently uses it: without it, the first
# component test written would silently return to being billed source.
#
# HOW TO TELL IF THIS WENT WRONG. The expected result is roughly 27,000-28,000
# lines, from 38,225 — the drop should be about the size of the suite and no
# larger. A total far below that would mean real source was swept into the test
# scope and is now being held to test rules instead of the rules that matter,
# which would look like a bigger win and be a loss. Check the language
# distribution in the next analysis: ts should fall from 34,649 by about the
# suite's size, and nothing else should move.
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
