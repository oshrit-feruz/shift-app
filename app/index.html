<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/shift-mark.svg" />
    <link rel="apple-touch-icon" href="/assets/shift-icon-180.png" />
    <!-- The install/launch identity: the manifest's background_color is what
         Android paints behind the icon while the app boots, so it matches the
         in-app splash ground rather than either theme's page colour. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The shell's gradient starts at --g1, so painting the browser chrome
         --g2 (the page ground) left a visible seam across the top edge. -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1E293B" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F1F5F9" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Weights 400–700 only: nothing renders at 300. Loaded non-blocking
         (media="print" until onload) so first paint doesn't wait on a
         third-party stylesheet round trip; display=swap covers the gap. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap"
      />
    </noscript>
    <title>Shift</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
